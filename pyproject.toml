[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp"
version = "0.1.0"
description = "Predictor of schedule deviations for urban ground transport"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "networkx>=3.2",
    "leuvenmapmatching>=1.1",
    "catboost>=1.2.3",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "onnxruntime>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
